<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "PopXB"; src: url(fonts/Poppins-ExtraBold.ttf); }
@font-face { font-family: "PopSB"; src: url(fonts/Poppins-SemiBold.ttf); }
html, body { margin: 0; background: #000; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// =====================================================================
//  Hosting / Internet partner ad - clean minimal style, synced voice-over
//  Design space 1920x1080, rendered at 1920*S x 1080*S (S=2 -> 4K UHD)
// =====================================================================
const S = +(new URLSearchParams(location.search).get('scale') || 2);
const DW = 1920, DH = 1080, W = DW * S, H = DH * S;
const FPS = S >= 2 ? 30 : 60, DURATION = 8.0;

// voice-over placement + word times inside each clip (from flite -psdur)
const VO = [{ at: 0.6, file: 0 }, { at: 3.7, file: 1 }];
const T = {
  lf: VO[0].at + 0.19,        // "Looking for"
  hosting: VO[0].at + 1.15,   // "hosting"
  partner1: VO[0].at + 1.75,  // "partner?"
  move: VO[0].at + 2.55,      // first block moves up
  orEven: VO[1].at + 0.19,    // "Or even"
  internet: VO[1].at + 1.05,  // "an internet"
  partner2: VO[1].at + 1.84,  // "partner"
};

const cvs = document.getElementById('c'); cvs.width = W; cvs.height = H;
const ctx = cvs.getContext('2d');

// ---------------- helpers ----------------
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, s, d) => clamp((t - s) / d);
const eExpo = t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t);
const eOut = t => 1 - Math.pow(1 - t, 3);
const eInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eQuint = t => t < .5 ? 16 * t ** 5 : 1 - Math.pow(-2 * t + 2, 5) / 2;
function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }

// palette: one clean accent gradient
const NAVY0 = '#04050d', NAVY1 = '#0a0e26';
const BLUE = [59, 130, 246], VIOLET = [139, 92, 246], CYAN = [34, 211, 238];
const SOFTW = '#F4F6FF', MUTED = '#A9B4E8';

// ---------------- background ----------------
const bokeh = [];
{ const r = rng(21); for (let i = 0; i < 26; i++) bokeh.push({ x: r() * DW, y: r() * DH, s: 3 + r() * 9, v: 4 + r() * 10, ph: r() * 6.28, col: r() < .5 ? BLUE : VIOLET }); }
function drawBackground(c, t) {
  const g = c.createLinearGradient(0, 0, DW, DH); g.addColorStop(0, NAVY1); g.addColorStop(.55, NAVY0); g.addColorStop(1, '#0b0820');
  c.fillStyle = g; c.fillRect(0, 0, DW, DH);
  const intro = eOut(prog(t, 0, 1.4));
  c.save(); c.globalCompositeOperation = 'lighter';
  const orbs = [[.18, .28, 780, BLUE, .30, .21], [.84, .72, 820, VIOLET, .30, .17], [.62, .18, 480, CYAN, .10, .25]];
  orbs.forEach(([x, y, R, col, a, sp], k) => {
    const ox = DW * x + Math.sin(t * sp + k * 2) * 90, oy = DH * y + Math.cos(t * sp * .8 + k) * 60;
    const gr = c.createRadialGradient(ox, oy, 0, ox, oy, R);
    gr.addColorStop(0, rgba(col, a * intro)); gr.addColorStop(.5, rgba(col, a * .35 * intro)); gr.addColorStop(1, rgba(col, 0));
    c.fillStyle = gr; c.fillRect(0, 0, DW, DH);
  });
  c.restore();
  // fine dot grid, fading toward the edges
  c.save();
  const sp = 44, off = (t * 6) % sp;
  for (let x = -sp + off; x < DW + sp; x += sp) for (let y = 20; y < DH; y += sp) {
    const dx = (x - 960) / 960, dy = (y - 540) / 540, d = Math.sqrt(dx * dx + dy * dy);
    const a = .11 * clamp(1.15 - d) * intro; if (a < .005) continue;
    c.fillStyle = `rgba(170,185,255,${a})`; c.fillRect(x - 1, y - 1, 2, 2);
  }
  c.restore();
  // large thin rotating ring behind the text
  c.save(); c.translate(960, 540); c.rotate(t * .06);
  const rg = c.createLinearGradient(-620, 0, 620, 0); rg.addColorStop(0, rgba(CYAN, 0)); rg.addColorStop(.5, rgba(VIOLET, .22 * intro)); rg.addColorStop(1, rgba(BLUE, 0));
  c.strokeStyle = rg; c.lineWidth = 1.5; c.beginPath(); c.arc(0, 0, 610, 0, Math.PI * 2); c.stroke();
  c.rotate(-t * .14); c.strokeStyle = `rgba(150,170,255,${.08 * intro})`; c.setLineDash([2, 14]); c.beginPath(); c.arc(0, 0, 690, 0, Math.PI * 2); c.stroke();
  c.restore();
  // soft floating bokeh
  c.save(); c.globalCompositeOperation = 'lighter';
  for (const b of bokeh) {
    let y = (b.y - b.v * t) % DH; if (y < 0) y += DH;
    const x = b.x + Math.sin(t * .4 + b.ph) * 18, a = (.05 + .07 * (.5 + .5 * Math.sin(t * 1.3 + b.ph))) * intro;
    const gr = c.createRadialGradient(x, y, 0, x, y, b.s * 2.2); gr.addColorStop(0, rgba(b.col, a)); gr.addColorStop(1, rgba(b.col, 0));
    c.fillStyle = gr; c.fillRect(x - b.s * 2.2, y - b.s * 2.2, b.s * 4.4, b.s * 4.4);
  }
  c.restore();
}

// ---------------- typography ----------------
// A line = sequence of words; each word is white or gradient. Letters rise out of a mask.
function makeLine(words, font, size, spacing) {
  const m = mk(4, 4).getContext('2d'); m.font = `${size}px ${font}`; m.letterSpacing = spacing + 'px';
  const space = m.measureText(' ').width;
  const letters = []; let x = 0, idx = 0;
  const ranges = [];
  words.forEach((w, wi) => {
    const x0 = x;
    for (const ch of w.text) { const cw = m.measureText(ch).width; letters.push({ ch, x, w: cw, word: wi, i: idx++ }); x += cw; }
    ranges.push([x0, x - spacing]); x += space;
  });
  const width = x - space - spacing;
  return { words, font, size, spacing, letters, width, ranges };
}
function lineFill(c, L, wi, x0) {
  if (L.words[wi].style !== 'grad') return SOFTW;
  const [a, b] = L.ranges[wi];
  const g = c.createLinearGradient(x0 + a, 0, x0 + b, 0);
  g.addColorStop(0, `rgb(${CYAN})`); g.addColorStop(.5, `rgb(${BLUE})`); g.addColorStop(1, `rgb(${VIOLET})`);
  return g;
}
const tLayer = mk(W, H), tctx = tLayer.getContext('2d');
// starts[wi] = reveal time of word wi; stagger per letter
function drawLine(c, L, cy, starts, stagger, dur, opts = {}) {
  const x0 = 960 - L.width / 2;
  tctx.setTransform(1, 0, 0, 1, 0, 0); tctx.clearRect(0, 0, W, H);
  tctx.setTransform(c.getTransform());
  tctx.font = `${L.size}px ${L.font}`; tctx.letterSpacing = '0px'; tctx.textBaseline = 'alphabetic';
  const base = cy + L.size * .36;
  tctx.save();
  tctx.beginPath(); tctx.rect(0, cy - L.size * .95, DW, L.size * 1.35); tctx.clip();   // mask
  let any = false;
  for (const ch of L.letters) {
    const st = starts[ch.word] + (ch.i - L.letters.findIndex(l => l.word === ch.word)) * stagger;
    const p = prog(opts.t, st, dur); if (p <= 0) continue; any = true;
    const e = eExpo(p);
    tctx.globalAlpha = clamp(p * 2.2);
    tctx.fillStyle = lineFill(tctx, L, ch.word, x0);
    tctx.fillText(ch.ch, x0 + ch.x, base + (1 - e) * L.size * 1.05);
  }
  tctx.restore();
  if (!any) return;
  // light sweep across the line once it has landed
  if (opts.sweep !== undefined) {
    const sp = prog(opts.t, opts.sweep, 1.1);
    if (sp > 0 && sp < 1) {
      tctx.save(); tctx.globalCompositeOperation = 'source-atop';
      const sx = lerp(x0 - 300, x0 + L.width + 300, eInOut(sp));
      const g = tctx.createLinearGradient(sx - 140, 0, sx + 140, 0);
      g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(.5, 'rgba(255,255,255,.75)'); g.addColorStop(1, 'rgba(255,255,255,0)');
      tctx.transform(1, 0, -.35, 1, 0, 0); tctx.fillStyle = g; tctx.fillRect(sx - 400, cy - L.size, 800 + L.size, L.size * 2);
      tctx.restore();
    }
  }
  c.save(); c.setTransform(1, 0, 0, 1, 0, 0);
  if (opts.glow) { c.save(); c.globalAlpha = opts.glow * (opts.alpha ?? 1); c.filter = `blur(${22 * S}px)`; c.globalCompositeOperation = 'lighter'; c.drawImage(tLayer, 0, 0); c.restore(); }
  c.globalAlpha = opts.alpha ?? 1; c.drawImage(tLayer, 0, 0);
  c.restore();
}
function accentBar(c, cx, y, w, a) {
  if (w <= 0 || a <= 0) return;
  c.save(); c.globalAlpha = a;
  const g = c.createLinearGradient(cx - w / 2, 0, cx + w / 2, 0);
  g.addColorStop(0, rgba(CYAN, 0)); g.addColorStop(.2, `rgb(${CYAN})`); g.addColorStop(.6, `rgb(${BLUE})`); g.addColorStop(1, rgba(VIOLET, 0));
  c.fillStyle = g; c.beginPath(); c.roundRect(cx - w / 2, y - 2, w, 4, 2); c.fill();
  c.restore();
}

let LF, HP, OE, IP;
function build() {
  LF = makeLine([{ text: 'LOOKING FOR' }], '"PopSB"', 46, 14);
  HP = makeLine([{ text: 'HOSTING' }, { text: 'PARTNER?', style: 'grad' }], '"PopXB"', 142, 1);
  OE = makeLine([{ text: 'OR EVEN' }], '"PopSB"', 46, 14);
  IP = makeLine([{ text: 'INTERNET' }, { text: 'PARTNER', style: 'grad' }], '"PopXB"', 142, 1);
}

window.renderFrame = function (t) {
  ctx.setTransform(S, 0, 0, S, 0, 0); ctx.globalAlpha = 1; ctx.filter = 'none'; ctx.globalCompositeOperation = 'source-over';
  drawBackground(ctx, t);
  const cam = 1 + .025 * eInOut(prog(t, 0, DURATION));
  ctx.translate(960, 540); ctx.scale(cam, cam); ctx.translate(-960, -540);

  // block 1 (LOOKING FOR + HOSTING PARTNER?) moves up and recedes for block 2
  const mv = eQuint(prog(t, T.move, .9));
  const b1y = lerp(0, -205, mv), b1s = lerp(1, .74, mv), b1a = lerp(1, .55, mv);
  ctx.save(); ctx.translate(960, 500 + b1y); ctx.scale(b1s, b1s); ctx.translate(-960, -500);
  drawLine(ctx, LF, 395, [T.lf], .028, .9, { t, alpha: b1a });
  accentBar(ctx, 960, 452, 220 * eExpo(prog(t, T.lf + .35, .9)), b1a * .9);
  drawLine(ctx, HP, 560, [T.hosting, T.partner1], .03, .95, { t, sweep: T.partner1 + .55, glow: .32, alpha: b1a });
  ctx.restore();

  // block 2 (OR EVEN + INTERNET PARTNER)
  drawLine(ctx, OE, 560, [T.orEven], .028, .9, { t });
  const dash = eExpo(prog(t, T.orEven + .35, .8));
  if (dash > 0) { ctx.save(); ctx.globalAlpha = .8; ctx.fillStyle = MUTED;
    ctx.fillRect(960 - OE.width / 2 - 40 - 70 * dash, 559, 70 * dash, 2); ctx.fillRect(960 + OE.width / 2 + 40, 559, 70 * dash, 2); ctx.restore(); }
  drawLine(ctx, IP, 715, [T.internet, T.partner2], .03, .95, { t, sweep: T.partner2 + .55, glow: .32 });
  accentBar(ctx, 960, 815, 520 * eExpo(prog(t, T.partner2 + .3, 1.0)), .95);

  // opening fade + soft vignette
  ctx.setTransform(S, 0, 0, S, 0, 0);
  const vg = ctx.createRadialGradient(960, 540, 420, 960, 540, 1150); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.5)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, DW, DH);
  const op = 1 - eOut(prog(t, 0, .8)); if (op > 0) { ctx.fillStyle = `rgba(0,0,0,${op})`; ctx.fillRect(0, 0, DW, DH); }
};

// =====================================================================
//  AUDIO: clean ambient-tech bed + subtle sound design + voice-over
// =====================================================================
async function buildAudio() {
  const SR = 48000, ac = new OfflineAudioContext(2, Math.round(SR * DURATION), SR);
  const master = ac.createGain(); master.gain.setValueAtTime(0, 0); master.gain.linearRampToValueAtTime(.9, .4);
  master.gain.setValueAtTime(.9, DURATION - .6); master.gain.linearRampToValueAtTime(0, DURATION);
  const lim = ac.createDynamicsCompressor(); lim.threshold.value = -6; lim.knee.value = 2; lim.ratio.value = 12; lim.attack.value = .002; lim.release.value = .12;
  master.connect(lim); lim.connect(ac.destination);
  const R = rng(5), irLen = SR * 3, ir = ac.createBuffer(2, irLen, SR);
  for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < irLen; i++) d[i] = (R() * 2 - 1) * Math.pow(1 - i / irLen, 4); }
  const verb = ac.createConvolver(); verb.buffer = ir; const vr = ac.createGain(); vr.gain.value = .35; verb.connect(vr); vr.connect(master);
  const music = ac.createGain(); music.gain.value = 1; music.connect(master);
  const sfx = ac.createGain(); sfx.gain.value = 1; sfx.connect(master);
  const nb = ac.createBuffer(1, SR * 2, SR); { const d = nb.getChannelData(0), r = rng(3); for (let i = 0; i < d.length; i++) d[i] = r() * 2 - 1; }
  const rr = rng(77);
  const env = (t, a, peak, d, dest, hold = 0) => { const g = ac.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t + a); if (hold) g.gain.setValueAtTime(peak, t + a + hold); g.gain.exponentialRampToValueAtTime(.0001, t + a + hold + d); g.connect(dest); return g; };
  const pan = (p, dest) => { const s = ac.createStereoPanner(); s.pan.value = p; s.connect(dest); return s; };
  const send = (node, amt) => { const g = ac.createGain(); g.gain.value = amt; node.connect(g); g.connect(verb); };
  const osc = (type, f, t, dur, dest) => { const o = ac.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t); o.connect(dest); o.start(t); o.stop(t + dur + .05); return o; };
  const filt = (type, f, q, dest) => { const b = ac.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q; b.connect(dest); return b; };
  const noise = (t, dur, dest) => { const s = ac.createBufferSource(); s.buffer = nb; s.loop = true; s.connect(dest); s.start(t, rr()); s.stop(t + dur + .05); };

  // ---- music bed (88 BPM feel, Fmaj7 - Am7 - Cmaj7 - G6) ----
  const BEAT = 60 / 88;
  const chords = [[174.61, 220, 261.63, 329.63], [220, 261.63, 329.63, 392], [261.63, 329.63, 392, 493.88], [196, 246.94, 293.66, 329.63]];
  const bassN = [87.31, 110, 130.81, 98];
  for (let k = 0; k * BEAT * 2 < DURATION; k++) {
    const t = k * BEAT * 2, ch = chords[k % 4];
    const lp = filt('lowpass', 1400, .4, music); send(lp, .9);
    ch.forEach((f, i) => { const g = env(t, .35, .028, 1.6, pan((i - 1.5) * .3, lp), BEAT * 2 - .3); osc('triangle', f, t, BEAT * 2 + 1.7, g); osc('sine', f * 2, t, BEAT * 2 + 1.7, env(t, .4, .008, 1.4, lp, BEAT * 2 - .3)); });
    if (t >= T.partner1 - .05) { const g = env(t, .02, .22, .5, music, BEAT * 2 - .5); osc('sine', bassN[k % 4], t, BEAT * 2, g); }
  }
  // gentle pluck arpeggio with ping-pong-ish delay
  const dl = ac.createDelay(1); dl.delayTime.value = BEAT * .75; const fb = ac.createGain(); fb.gain.value = .35; dl.connect(fb); fb.connect(dl);
  const dOut = filt('lowpass', 3500, .5, pan(.35, music)); const dg = ac.createGain(); dg.gain.value = .4; dl.connect(dg); dg.connect(dOut);
  for (let k = 0; k * BEAT / 2 < DURATION - .3; k++) {
    const t = .3 + k * BEAT / 2, ch = chords[Math.floor((t) / (BEAT * 2)) % 4], f = ch[[0, 2, 1, 3, 2, 1, 3, 2][k % 8]] * 2;
    const out = pan(-.2, music); out.connect(dl); send(out, .5);
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(3200, t); lp.frequency.exponentialRampToValueAtTime(700, t + .3); lp.connect(env(t, .004, .035, .45, out));
    osc('triangle', f, t, .5, lp); osc('sine', f * 2, t, .3, lp);
  }
  // light rhythm once "partner?" lands: soft kick + shaker
  for (let k = 0; T.partner1 + k * BEAT < DURATION - .4; k++) {
    const t = T.partner1 + k * BEAT;
    const g = env(t, .003, .38, .32, music); osc('sine', 110, t, .35, g).frequency.exponentialRampToValueAtTime(48, t + .1);
    for (const o of [.5, .75]) noise(t + BEAT * o, .06, filt('highpass', 7000, .5, pan(.25, env(t + BEAT * o, .01, o === .5 ? .05 : .025, .05, music))));
  }

  // ---- sound design: soft, airy ----
  function swoosh(t, dur, v, f0, f1) {
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = .8; bp.frequency.setValueAtTime(f0, t); bp.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = ac.createGain(); g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + dur * .6); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    bp.connect(g); g.connect(sfx); send(g, .4); noise(t, dur, bp);
  }
  function chime(t, base, v = .05) { [1, 1.5, 2, 3].forEach((m, i) => { const out = pan((i - 1.5) * .35, sfx); send(out, 1.2); osc('sine', base * m, t + i * .045, 1.6, env(t + i * .045, .004, v / (1 + i * .4), 1.5, out)); }); }
  function softHit(t, v = .4) { const g = env(t, .005, v, .9, sfx); osc('sine', 82, t, 1, g).frequency.exponentialRampToValueAtTime(40, t + .6); const n = env(t, .003, v * .12, .25, sfx); send(n, .6); noise(t, .3, filt('lowpass', 900, .5, n)); }
  function tick(t, v = .02) { osc('sine', 2400, t, .02, env(t, .001, v, .02, pan((rr() - .5) * .4, sfx))); }
  function riser(t0, t1, v = .07) { const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.2; bp.frequency.setValueAtTime(500, t0); bp.frequency.exponentialRampToValueAtTime(5000, t1);
    const g = ac.createGain(); g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(v, t1 - .05); g.gain.exponentialRampToValueAtTime(.0001, t1 + .15); bp.connect(g); g.connect(sfx); send(g, .5); noise(t0, t1 - t0 + .2, bp); }

  swoosh(0, 1.2, .06, 300, 3000); chime(.25, 523.25, .03);
  swoosh(T.lf - .15, .55, .05, 1500, 6000);
  swoosh(T.hosting - .25, .5, .08, 400, 4000);
  riser(T.hosting, T.partner1, .05);
  softHit(T.partner1, .45); chime(T.partner1 + .05, 659.25, .045);
  swoosh(T.partner1 + .5, .9, .035, 3000, 9000);                    // light sweep
  swoosh(T.move - .05, 1.0, .07, 250, 2500);                         // block moves up
  swoosh(T.orEven - .15, .55, .05, 1500, 6000);
  swoosh(T.internet - .25, .5, .08, 400, 4000);
  riser(T.internet, T.partner2, .05);
  softHit(T.partner2, .5); chime(T.partner2 + .05, 783.99, .05);
  swoosh(T.partner2 + .5, .9, .035, 3000, 9000);
  chime(DURATION - 1.6, 1046.5, .025);

  // ---- voice-over: clean chain + music ducking ----
  if (window.VO_B64) {
    const hp = filt('highpass', 85, .7, null), warm = ac.createBiquadFilter(), pres = ac.createBiquadFilter(), deharsh = ac.createBiquadFilter();
    warm.type = 'lowshelf'; warm.frequency.value = 220; warm.gain.value = 2.5;
    pres.type = 'peaking'; pres.frequency.value = 3200; pres.Q.value = .9; pres.gain.value = 3;
    deharsh.type = 'lowpass'; deharsh.frequency.value = 7200; deharsh.Q.value = .5;
    const vc = ac.createDynamicsCompressor(); vc.threshold.value = -22; vc.ratio.value = 4; vc.attack.value = .004; vc.release.value = .15; vc.knee.value = 6;
    const vg = ac.createGain(); vg.gain.value = 1;
    hp.connect(warm); warm.connect(pres); pres.connect(deharsh); deharsh.connect(vc); vc.connect(vg); vg.connect(master);
    const vs = ac.createGain(); vs.gain.value = .12; vg.connect(vs); vs.connect(verb);
    for (const v of VO) {
      const bin = atob(window.VO_B64[v.file]); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
      const buf = await ac.decodeAudioData(u.buffer);
      let pk = 0; const d = buf.getChannelData(0); for (let i = 0; i < d.length; i++) pk = Math.max(pk, Math.abs(d[i]));
      const s = ac.createBufferSource(); s.buffer = buf; const g = ac.createGain(); g.gain.value = .9 / pk; s.connect(g); g.connect(hp); s.start(v.at);
      // duck music + sfx under the voice
      const a = v.at + .1, b = v.at + buf.duration - .1;
      for (const bus of [music]) { bus.gain.setTargetAtTime(.32, a - .15, .06); bus.gain.setTargetAtTime(1, b, .25); }
    }
  }
  return await ac.startRendering();
}
