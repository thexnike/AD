<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "InterX"; src: url(fonts/Inter.ttf); font-weight: 100 900; }
@font-face { font-family: "SinX"; src: url(fonts/NotoSansSinhala.ttf); font-weight: 100 900; font-stretch: 75% 100%; }
@font-face { font-family: "AntonX"; src: url(fonts/Anton.ttf); }
html, body { margin: 0; background: #000; }
canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// =====================================================================
//  TikTok ad (1080x1920, 15s)
//  1) "Still paying too much for data cost?"  -> cursor click -> glass cracks
//  2) shards swirl away -> Sinhala slams: අඩුම / ගණනට / හොඳම තැනින්
//  3) UNLIMITED (letter slams) + DATA (glitch + big impact)
//  Visuals and the synthesized soundtrack share the same timeline (T).
// =====================================================================
const W = 1080, H = 1920, FPS = 60, DURATION = 15;
const BEAT = 60 / 128;
const DROP = 5.0;
const T = {
  spark: 0.2, typeStart: 0.45, charStep: 0.034, charDur: 0.38,
  shimmer: 2.15, cursorIn: 2.5, click: 3.45, shatter: DROP,
  w: [DROP + BEAT * 1, DROP + BEAT * 2, DROP + BEAT * 3],
  s2exit: DROP + BEAT * 8,
  s3: DROP + BEAT * 9,
  letterStep: BEAT / 2,
  data: DROP + BEAT * 14,
};
T.dataGlitches = [T.data + 1.15, T.data + 2.35];

const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');

// ---------------- helpers ----------------
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, s, d) => clamp((t - s) / d);
const eOut = t => 1 - Math.pow(1 - t, 3);
const eIn = t => t * t * t;
const eInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const eBack = t => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
function rng(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const mix3 = (a, b, t) => a.map((v, i) => Math.round(lerp(v, b[i], t)));
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
// damped spring 0->1 (overshoot), p in seconds since impact
const spring = (s) => 1 - Math.exp(-s * 9) * Math.cos(s * 22);

// ---------------- shared resources ----------------
const noise = mk(256, 256);
{
  const n = noise.getContext('2d'), img = n.createImageData(256, 256), r = rng(7);
  for (let i = 0; i < img.data.length; i += 4) { const v = r() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  n.putImageData(img, 0, 0);
}
const particles = [];
{ const r = rng(42); for (let i = 0; i < 80; i++) particles.push({ x: r() * W, y: r() * H, s: 1 + r() * 3.4, v: 18 + r() * 60, ph: r() * 6.28, tw: 1.5 + r() * 3, hue: r() < .6 ? [190, 140, 255] : [255, 150, 235], dx: (r() - .5) * 30 }); }
const streaks = [];
{ const r = rng(5); for (let i = 0; i < 90; i++) streaks.push({ a: r() * 6.283, sp: 0.35 + r() * 0.9, off: r(), w: 1 + r() * 2.5 }); }

// =====================================================================
//  SCENE 1
// =====================================================================
const S1_LINES = ['Still paying too much', 'for data cost?'];
const S1_FONT = '"InterX", sans-serif', S1_WEIGHT = 600;
let s1Size = 96, s1Layout = [], s1Block = {}, CP = { x: 540, y: 880 };
function s1ComputeLayout() {
  ctx.font = `${S1_WEIGHT} ${s1Size}px ${S1_FONT}`;
  let widest = Math.max(...S1_LINES.map(l => ctx.measureText(l).width));
  s1Size = Math.floor(s1Size * Math.min(1, 860 / widest));
  ctx.font = `${S1_WEIGHT} ${s1Size}px ${S1_FONT}`;
  widest = Math.max(...S1_LINES.map(l => ctx.measureText(l).width));
  const lineH = s1Size * 1.25, totalH = lineH * S1_LINES.length;
  const left = (W - widest) / 2 + 14, top = 880 - totalH / 2;
  s1Layout = []; let idx = 0;
  S1_LINES.forEach((line, li) => {
    const y = top + lineH * li + s1Size; let x = left;
    for (const ch of line) { const w = ctx.measureText(ch).width; s1Layout.push({ ch, x, y, w, i: idx++, line: li }); x += w; }
  });
  s1Block = { left, top, width: widest, height: totalH };
  // click target: middle of the word "too"
  const tw = s1Layout.filter(l => l.line === 0 && l.i >= 13 && l.i <= 15);
  CP = { x: (tw[0].x + tw[2].x + tw[2].w) / 2, y: tw[0].y - s1Size * 0.33 };
}
const charStart = L => T.typeStart + L.i * T.charStep + (L.line ? 0.1 : 0);

const tLayer = mk(W, H), tctx = tLayer.getContext('2d');

function starPath(c, rays, outer, inner) {
  c.beginPath();
  for (let i = 0; i < rays * 2; i++) { const r = i % 2 ? inner : outer, a = i / (rays * 2) * Math.PI * 2 - Math.PI / 2; c.lineTo(Math.cos(a) * r, Math.sin(a) * r); }
  c.closePath();
}
function drawSparkle(c, x, y, size, rot, alpha) {
  if (alpha <= 0 || size <= 0) return;
  c.save(); c.translate(x, y); c.globalCompositeOperation = 'lighter'; c.globalAlpha = alpha;
  let g = c.createRadialGradient(0, 0, 0, 0, 0, size * 3.2);
  g.addColorStop(0, 'rgba(255,140,240,0.85)'); g.addColorStop(.25, 'rgba(200,90,255,0.45)'); g.addColorStop(1, 'rgba(120,40,220,0)');
  c.fillStyle = g; c.beginPath(); c.arc(0, 0, size * 3.2, 0, 6.283); c.fill();
  g = c.createLinearGradient(-size * 5, 0, size * 5, 0);
  g.addColorStop(0, 'rgba(255,150,250,0)'); g.addColorStop(.5, 'rgba(255,190,255,0.55)'); g.addColorStop(1, 'rgba(255,150,250,0)');
  c.fillStyle = g; c.fillRect(-size * 5, -size * .06, size * 10, size * .12);
  c.rotate(rot);
  c.save(); c.rotate(Math.PI / 8); starPath(c, 8, size * .95, size * .07); c.fillStyle = 'rgba(255,170,250,0.75)'; c.fill(); c.restore();
  starPath(c, 4, size * 1.25, size * .16);
  g = c.createRadialGradient(0, 0, 0, 0, 0, size * 1.25);
  g.addColorStop(0, '#fff'); g.addColorStop(.35, 'rgba(255,200,255,1)'); g.addColorStop(1, 'rgba(240,110,255,0.9)');
  c.fillStyle = g; c.fill();
  g = c.createRadialGradient(0, 0, 0, 0, 0, size * .35); g.addColorStop(0, '#fff'); g.addColorStop(1, 'rgba(255,255,255,0)');
  c.fillStyle = g; c.beginPath(); c.arc(0, 0, size * .35, 0, 6.283); c.fill();
  c.restore();
}
function drawParticles(c, t, a, boost = 1) {
  c.save(); c.globalCompositeOperation = 'lighter';
  for (const p of particles) {
    let y = (p.y - p.v * boost * t) % H; if (y < 0) y += H;
    const x = p.x + Math.sin(t * .8 + p.ph) * p.dx;
    const al = (0.25 + 0.75 * (0.5 + 0.5 * Math.sin(t * p.tw + p.ph))) * 0.55 * a;
    const g = c.createRadialGradient(x, y, 0, x, y, p.s * 4);
    g.addColorStop(0, rgba(p.hue, al)); g.addColorStop(1, rgba(p.hue, 0));
    c.fillStyle = g; c.fillRect(x - p.s * 4, y - p.s * 4, p.s * 8, p.s * 8);
  }
  c.restore();
}

function renderScene1(c, t) {
  c.save();
  c.fillStyle = '#0c0b0f'; c.fillRect(0, 0, W, H);
  const intro = eOut(prog(t, 0, 0.8)), breath = 1 + 0.06 * Math.sin(t * 1.6);
  // nebula blobs
  c.save(); c.globalCompositeOperation = 'lighter';
  const blobs = [[0.2, 0.42, 700, [80, 36, 160], 0.55], [0.85, 0.36, 520, [36, 30, 120], 0.4], [0.55, 0.62, 600, [90, 30, 140], 0.25], [0.3, 0.75, 500, [40, 20, 90], 0.3]];
  blobs.forEach((b, k) => {
    const x = W * b[0] + Math.sin(t * .5 + k * 2) * 70, y = H * b[1] + Math.cos(t * .4 + k) * 60;
    const g = c.createRadialGradient(x, y, 0, x, y, b[2] * breath);
    g.addColorStop(0, rgba(b[3], b[4] * intro)); g.addColorStop(1, rgba(b[3], 0));
    c.fillStyle = g; c.fillRect(0, 0, W, H);
  });
  c.restore();
  // main glow behind the sparkle (reference style)
  const gx = s1Block.left + 120 + Math.sin(t * .7) * 40, gy = s1Block.top + s1Block.height * .45 + Math.cos(t * .5) * 30;
  let g = c.createRadialGradient(gx, gy, 0, gx, gy, 820 * breath);
  g.addColorStop(0, `rgba(96,44,178,${.7 * intro})`); g.addColorStop(.35, `rgba(62,28,128,${.45 * intro})`);
  g.addColorStop(.7, `rgba(30,16,62,${.2 * intro})`); g.addColorStop(1, 'rgba(12,11,15,0)');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  // soft rotating light beams
  c.save(); c.globalCompositeOperation = 'lighter'; c.filter = 'blur(40px)'; c.translate(gx, gy);
  for (let k = 0; k < 3; k++) {
    c.save(); c.rotate(t * .12 + k * 2.1);
    const bg = c.createLinearGradient(0, 0, 1400, 0); bg.addColorStop(0, `rgba(150,90,255,${.06 * intro})`); bg.addColorStop(1, 'rgba(150,90,255,0)');
    c.fillStyle = bg; c.beginPath(); c.moveTo(0, 0); c.lineTo(1400, -170); c.lineTo(1400, 170); c.closePath(); c.fill(); c.restore();
  }
  c.restore();
  drawParticles(c, t, eOut(prog(t, .2, 1.2)));

  // camera push
  const cam = 1 + 0.05 * eInOut(prog(t, 0, DROP));
  c.translate(W / 2, s1Block.top + s1Block.height / 2); c.scale(cam, cam); c.translate(-W / 2, -(s1Block.top + s1Block.height / 2));

  // ---- text ----
  tctx.clearRect(0, 0, W, H);
  tctx.font = `${S1_WEIGHT} ${s1Size}px ${S1_FONT}`;
  for (const L of s1Layout) {
    if (L.ch === ' ') continue;
    const p = prog(t, charStart(L), T.charDur); if (p <= 0) continue;
    const e = eOut(p), sc = lerp(.4, 1, eBack(clamp(p * 1.15)));
    const blur = (1 - e) * 16, dy = (1 - e) * 60, flash = clamp(1 - p * 1.6);
    const col = mix3([238, 236, 245], [220, 165, 255], flash);
    tctx.save(); tctx.globalAlpha = e;
    if (blur > .3) tctx.filter = `blur(${blur.toFixed(1)}px)`;
    tctx.translate(L.x + L.w / 2, L.y - s1Size * .35 + dy);
    tctx.rotate((1 - e) * 0.35);
    tctx.scale(sc, sc);
    tctx.fillStyle = `rgb(${col})`; tctx.fillText(L.ch, -L.w / 2, s1Size * .35);
    tctx.restore();
  }
  const sw = prog(t, T.shimmer, 0.9);
  if (sw > 0 && sw < 1) {
    const sx = lerp(s1Block.left - 400, s1Block.left + s1Block.width + 400, eInOut(sw));
    tctx.save(); tctx.globalCompositeOperation = 'source-atop';
    const sg = tctx.createLinearGradient(sx - 160, 0, sx + 160, 0);
    sg.addColorStop(0, 'rgba(255,255,255,0)'); sg.addColorStop(.45, 'rgba(225,185,255,.95)'); sg.addColorStop(.5, '#fff');
    sg.addColorStop(.55, 'rgba(225,185,255,.95)'); sg.addColorStop(1, 'rgba(255,255,255,0)');
    tctx.setTransform(1, 0, -.35, 1, 0, 0); tctx.fillStyle = sg; tctx.fillRect(sx - 400, 0, 800 + H * .35, H); tctx.restore();
  }
  c.save(); c.globalAlpha = .4; c.filter = 'blur(20px)'; c.globalCompositeOperation = 'lighter'; c.drawImage(tLayer, 0, 0); c.restore();
  c.save(); c.shadowColor = 'rgba(170,110,255,.4)'; c.shadowBlur = 16; c.drawImage(tLayer, 0, 0); c.restore();

  // lens streak travelling with the shimmer
  if (sw > 0 && sw < 1) {
    const sx = lerp(s1Block.left - 100, s1Block.left + s1Block.width + 100, eInOut(sw));
    drawSparkle(c, sx, s1Block.top + s1Block.height * .3, 22, t * 3, Math.sin(sw * Math.PI) * .8);
  }
  // typing head glint
  const last = charStart(s1Layout[s1Layout.length - 1]);
  if (t >= T.typeStart && t <= last + .35) {
    let cur = s1Layout[0]; for (const L of s1Layout) if (t >= charStart(L)) cur = L;
    drawSparkle(c, cur.x + cur.w + 6, cur.y - s1Size * .36, 14 + 3 * Math.sin(t * 30), t * 4, .75 * (1 - prog(t, last, .35)));
  }
  // main sparkle (reference: sits at top-left of the first letter)
  const sp = prog(t, T.spark, .55);
  if (sp > 0) {
    const x = s1Block.left - 4, y = s1Block.top + s1Size * .1;
    const tw = 1 + .12 * Math.sin(t * 7) + .06 * Math.sin(t * 13.3);
    drawSparkle(c, x, y, 48 * eBack(sp) * tw, (1 - eOut(sp)) * -2.4 + Math.sin(t * 1.2) * .12, clamp(sp * 3));
    const fp = prog(t, T.spark, .7);
    if (fp > 0 && fp < 1) {
      c.save(); c.globalCompositeOperation = 'lighter';
      c.strokeStyle = `rgba(220,150,255,${.45 * (1 - fp)})`; c.lineWidth = lerp(8, 1, fp);
      c.beginPath(); c.arc(x, y, lerp(20, 460, eOut(fp)), 0, 6.283); c.stroke();
      const fg = c.createRadialGradient(x, y, 0, x, y, 380); fg.addColorStop(0, `rgba(255,200,255,${.45 * (1 - fp)})`); fg.addColorStop(1, 'rgba(255,200,255,0)');
      c.fillStyle = fg; c.fillRect(x - 380, y - 380, 760, 760);
      const r = rng(99);
      for (let i = 0; i < 18; i++) {
        const a = r() * 6.283, d = (160 + r() * 320) * eOut(fp), s = (2 + r() * 3) * (1 - fp);
        c.fillStyle = `rgba(255,${170 + r() * 60 | 0},255,${1 - fp})`; c.beginPath(); c.arc(x + Math.cos(a) * d, y + Math.sin(a) * d, s, 0, 6.283); c.fill();
      }
      c.restore();
    }
  }
  c.restore();
}

// ---------------- cursor ----------------
const CURSOR_PTS = [[0, 0], [0, 36], [9, 27.5], [15.5, 42], [22, 39], [15.8, 25], [28, 25]];
function cursorPos(t) {
  const p = eInOut(prog(t, T.cursorIn, T.click - 0.08 - T.cursorIn));
  const a = { x: 1180, y: 1650 }, ctl = { x: CP.x + 520, y: CP.y + 260 }, b = { x: CP.x - 6, y: CP.y - 4 };
  let x = (1 - p) * (1 - p) * a.x + 2 * (1 - p) * p * ctl.x + p * p * b.x;
  let y = (1 - p) * (1 - p) * a.y + 2 * (1 - p) * p * ctl.y + p * p * b.y;
  const away = eIn(prog(t, T.click + 0.35, 0.5));
  x += away * 380; y += away * 520;
  return { x, y };
}
function drawCursorAt(c, x, y, s, alpha) {
  c.save(); c.globalAlpha = alpha; c.translate(x, y); c.rotate(-0.08); c.scale(s, s);
  c.shadowColor = 'rgba(0,0,0,.55)'; c.shadowBlur = 14; c.shadowOffsetX = 4; c.shadowOffsetY = 8;
  c.beginPath(); CURSOR_PTS.forEach(([px, py], i) => i ? c.lineTo(px, py) : c.moveTo(px, py)); c.closePath();
  c.fillStyle = '#fff'; c.fill();
  c.shadowColor = 'transparent'; c.lineJoin = 'round'; c.lineWidth = 2.2; c.strokeStyle = '#111'; c.stroke();
  c.restore();
}
function drawCursor(c, t) {
  if (t < T.cursorIn || t > T.click + 0.9) return;
  const fadeIn = prog(t, T.cursorIn, .15), fadeOut = 1 - prog(t, T.click + .5, .35);
  const press = 1 - 0.22 * Math.sin(Math.PI * prog(t, T.click - .06, .14));
  for (let k = 4; k >= 1; k--) { // motion trail
    const pt = cursorPos(t - k * 0.018);
    drawCursorAt(c, pt.x, pt.y, 2.7 * press, 0.09 * fadeIn * fadeOut * (5 - k) / 4);
  }
  const p = cursorPos(t);
  drawCursorAt(c, p.x, p.y, 2.7 * press, fadeIn * fadeOut);
  // click ripples
  for (const d of [0, .09]) {
    const rp = prog(t, T.click + d, .45);
    if (rp > 0 && rp < 1) {
      c.save(); c.globalCompositeOperation = 'lighter';
      c.strokeStyle = `rgba(255,255,255,${.85 * (1 - rp)})`; c.lineWidth = 6 * (1 - rp) + 1;
      c.beginPath(); c.arc(CP.x, CP.y, lerp(10, 170, eOut(rp)), 0, 6.283); c.stroke(); c.restore();
    }
  }
}

// ---------------- glass cracks + shards ----------------
const RINGS = [0, 55, 140, 270, 440, 660, 940, 1300, 2600];
const NA = 18;
let V = [], cells = [], crackEdges = [];
function buildShards() {
  const r = rng(2024);
  const base = []; for (let i = 0; i < NA; i++) base.push((i + (r() - .5) * .55) / NA * Math.PI * 2);
  V = [];
  for (let i = 0; i < NA; i++) {
    V.push([]);
    for (let j = 0; j < RINGS.length; j++) {
      if (j === 0) { V[i].push({ x: CP.x, y: CP.y, r: 0 }); continue; }
      const a = base[i] + (r() - .5) * .16, rad = RINGS[j] * (1 + (r() - .5) * .28);
      V[i].push({ x: CP.x + Math.cos(a) * rad, y: CP.y + Math.sin(a) * rad, r: rad });
    }
  }
  cells = [];
  for (let i = 0; i < NA; i++) for (let j = 0; j < RINGS.length - 1; j++) {
    const i2 = (i + 1) % NA;
    const poly = j === 0 ? [V[i][0], V[i2][1], V[i][1]] : [V[i][j], V[i2][j], V[i2][j + 1], V[i][j + 1]];
    const cx = poly.reduce((s, p) => s + p.x, 0) / poly.length, cy = poly.reduce((s, p) => s + p.y, 0) / poly.length;
    const xs = poly.map(p => p.x), ys = poly.map(p => p.y);
    const bx = Math.max(0, Math.floor(Math.min(...xs)) - 2), by = Math.max(0, Math.floor(Math.min(...ys)) - 2);
    const bw = Math.min(W, Math.ceil(Math.max(...xs)) + 2) - bx, bh = Math.min(H, Math.ceil(Math.max(...ys)) + 2) - by;
    if (bw <= 0 || bh <= 0) continue;
    const dist = Math.hypot(cx - CP.x, cy - CP.y);
    cells.push({ poly, cx, cy, bx, by, bw, bh, dist, ang: Math.atan2(cy - CP.y, cx - CP.x),
      r1: r(), r2: r(), r3: r(), sheen: .03 + r() * .09 });
  }
  crackEdges = [];
  for (let i = 0; i < NA; i++) for (let j = 0; j < RINGS.length - 1; j++) {
    crackEdges.push({ a: V[i][j], b: V[i][j + 1], r0: V[i][j].r, r1: V[i][j + 1].r, radial: true });
    if (j >= 1 && r() > .22) crackEdges.push({ a: V[i][j], b: V[(i + 1) % NA][j], r0: V[i][j].r, r1: V[i][j].r, radial: false });
  }
}
function crackGrowth(t) {
  // fast initial spread, then a second stress-crack step
  return 1500 * (0.62 * eOut(prog(t, T.click, .32)) + 0.38 * eOut(prog(t, T.click + .62, .28)));
}
function drawCracks(c, t) {
  const R = crackGrowth(t);
  const energy = .45 + .55 * smooth(T.click + .8, DROP, t) + .25 * Math.sin(t * 40) * smooth(DROP - .4, DROP, t);
  c.save(); c.globalCompositeOperation = 'lighter'; c.lineCap = 'round';
  for (const pass of [[9, `rgba(170,100,255,${.22 * energy})`], [3.5, `rgba(220,170,255,${.45 * energy})`], [1.4, `rgba(255,255,255,${.9})`]]) {
    c.lineWidth = pass[0]; c.strokeStyle = pass[1]; c.beginPath();
    for (const e of crackEdges) {
      if (e.radial) {
        if (R <= e.r0) continue;
        const f = clamp((R - e.r0) / Math.max(1, e.r1 - e.r0));
        c.moveTo(e.a.x, e.a.y); c.lineTo(lerp(e.a.x, e.b.x, f), lerp(e.a.y, e.b.y, f));
      } else {
        const f = clamp((R - e.r0) / 140); if (f <= 0) continue;
        const mx = (e.a.x + e.b.x) / 2, my = (e.a.y + e.b.y) / 2;
        c.moveTo(lerp(mx, e.a.x, f), lerp(my, e.a.y, f)); c.lineTo(lerp(mx, e.b.x, f), lerp(my, e.b.y, f));
      }
    }
    c.stroke();
  }
  // impact point
  const ip = prog(t, T.click, .2);
  if (ip > 0) {
    const g = c.createRadialGradient(CP.x, CP.y, 0, CP.x, CP.y, 120);
    g.addColorStop(0, `rgba(255,255,255,${.9 * energy})`); g.addColorStop(.3, `rgba(200,140,255,${.4 * energy})`); g.addColorStop(1, 'rgba(160,90,255,0)');
    c.fillStyle = g; c.fillRect(CP.x - 120, CP.y - 120, 240, 240);
  }
  c.restore();
}
const snap = mk(W, H), snapCtx = snap.getContext('2d');

  creak(T.click + .7, DROP - .05);
  riser(T.click + .5, DROP - .02, .32);
  // DROP 1: shatter + Sinhala slams
  shatterSfx(DROP); impact(DROP, .9); crash(DROP, .3);
  T.w.forEach(w => { whoosh(w - .2, .2, .22, 500, 6000); impact(w, .55); });
  for (let b = 0; b < 8; b++) {
    const t = DROP + b * BEAT; kick(t, 1);
    hat(t + BEAT / 2, .2); hat(t + BEAT / 4, .07); hat(t + BEAT * .75, .07);
    const root = b < 4 ? 110 : 87.31;
    bass(t + BEAT / 2, root * 2, BEAT / 2 - .01, .16); bass(t + BEAT * .75, root * 2, BEAT / 4 - .01, .12);
    const ch = b < 4 ? AM : F;
    for (let s = 0; s < 4; s++) pluck(t + s * BEAT / 4, ch[(b * 4 + s) % 3] * (s === 3 ? 4 : 2), .045, s % 2 ? .4 : -.4);
  }
  pad(DROP, BEAT * 4, AM, .03); pad(DROP + BEAT * 4, BEAT * 4, F, .03);
  dropSection(DROP, 8, false);
  // transition to scene 3
  whoosh(T.s2exit, .45, .3, 300, 7000); revCymbal(T.s3, .9, .3);
  // UNLIMITED letter hits (rising)
  for (let i = 0; i < 9; i++) tom(T.s3 + i * T.letterStep, 70 * Math.pow(2, i * 1.5 / 12), .65);
  impact(T.s3, .5);
  for (let i = 0; i < 9; i++) { duck(T.s3 + i * T.letterStep, .5); if (i % 2 === 0) kick(T.s3 + i * T.letterStep, .8); }
  sub808(T.s3, 49, T.data - T.s3 - .3, .4);
  pad(T.s3, T.data - T.s3, G, .035);
  for (let k = 0; T.s3 + k * BEAT / 2 < T.data - .01; k++) bass(T.s3 + k * BEAT / 2, 98, BEAT / 2 - .02, .22);
  for (let k = 0; k < 8; k++) clap(T.data - BEAT * 2 + k * BEAT / 4, .12 + k * .05); // snare build
  riser(T.data - 1.6, T.data - .02, .34);
  for (let k = 0; k < 6; k++) zap(T.data - .3 + k * .05, 300 + rr() * 1800);
  // DROP 2: DATA
  impact(T.data, 1); crash(T.data, .35); shatterSfx(T.data + .01);
  for (const gt of T.dataGlitches) for (let k = 0; k < 3; k++) zap(gt + k * .03, 400 + rr() * 2000);
  for (let b = 0; T.data + b * BEAT < DURATION - .05; b++) {
    const t = T.data + b * BEAT; kick(t, 1);
    hat(t + BEAT / 2, .22); hat(t + BEAT / 4, .07); hat(t + BEAT * .75, .07);
    const root = b < 4 ? 110 : 87.31, ch = b < 4 ? AM : F;
    bass(t + BEAT / 2, root * 2, BEAT / 2 - .01, .16); bass(t + BEAT * .75, root * 2, BEAT / 4 - .01, .12);
    for (let s = 0; s < 4; s++) pluck(t + s * BEAT / 4, ch[(b * 4 + s) % 3] * (s === 3 ? 4 : 2), .05, s % 2 ? .4 : -.4);
  }
  pad(T.data, BEAT * 4, AM, .035); pad(T.data + BEAT * 4, DURATION - T.data - BEAT * 4, F, .035);
  dropSection(T.data, Math.ceil((DURATION - T.data) / BEAT), true);
  return await ac.startRendering();
}

window.sceneInfo = { W, H, FPS, DURATION };
window.ready = (async () => {
  await Promise.all([document.fonts.load('600 96px "InterX"'), document.fonts.load('800 200px "SinX"'), document.fonts.load('200px "AntonX"')]);
  s1ComputeLayout(); buildShards(); buildArt();
  renderFrame(0);
})();
window.buildAudio = buildAudio;
